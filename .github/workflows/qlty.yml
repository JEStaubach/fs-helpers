name: Qlty Coverage

on: [push, pull_request]

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    name: Coverage / Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild esbuild
      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
      - name: Build
        run: npm run build
      - name: Run ESLint
        run: npm run lint
      - name: Run Qlty checks
        run: qlty check --all --no-fix --no-progress --no-fail
      - name: Run tests and collect coverage
        run: npm test
      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          oidc: true
          files: coverage/lcov.info
